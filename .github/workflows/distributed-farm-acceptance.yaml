name: Distributed Farm Acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Acceptance surface to exercise
        required: true
        type: choice
        options:
          - production-ops
          - distributed-linux
          - distributed-container
          - distributed-windows
          - beam-runtime
          - cancellation
      linux_pool:
        description: Linux scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-ops
        options:
          - ci-pool-ops
          - ci-pool-rust
          - ci-pool-acceptance-linux
      windows_pool:
        description: Windows scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-windows
        options:
          - ci-pool-windows
          - ci-pool-acceptance-linux
          - ci-pool-acceptance-windows
      container_pool:
        description: Container scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-residential-egress
        options:
          - ci-pool-residential-egress
          - ci-pool-acceptance-linux
          - ci-pool-acceptance-windows
          - ci-pool-acceptance-container
      cancellation_pool:
        description: Scale-set routing label used for cancellation proof
        required: true
        type: choice
        default: ci-pool-ops
        options:
          - ci-pool-ops
          - ci-pool-acceptance-linux
          - ci-pool-acceptance-windows
      beam_pool:
        description: Isolated Linux pool with the BEAM memory and image contract
        required: true
        type: choice
        default: ci-pool-acceptance-beam
        options:
          - ci-pool-acceptance-beam

permissions:
  contents: read

jobs:
  production-ops:
    if: inputs.target == 'production-ops'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && 'ci-pool-ops' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record production ops isolation and nested-cgroup evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nkernel=%s\n' "$RUNNER_NAME" "$(hostname)" "$(uname -srmo)"
          test -r /proc/self/cgroup
          cat /proc/self/cgroup
          test -r /sys/fs/cgroup/cgroup.controllers
          grep -Eq '(^| )cpu( |$)' /sys/fs/cgroup/cgroup.controllers
          grep -Eq '(^| )memory( |$)' /sys/fs/cgroup/cgroup.controllers
          grep -Eq ' - cgroup2 ' /proc/self/mountinfo
          test ! -S /var/run/docker.sock
          test "$(cat /sys/fs/cgroup/memory.max)" != max
          test "$(cut -d ' ' -f 1 /sys/fs/cgroup/cpu.max)" != max
          test "$(cat /sys/fs/cgroup/pids.max)" != max
          printf 'memory.max=%s cpu.max=%s pids.max=%s\n' \
            "$(cat /sys/fs/cgroup/memory.max)" \
            "$(cat /sys/fs/cgroup/cpu.max)" \
            "$(cat /sys/fs/cgroup/pids.max)"

  distributed-linux:
    if: inputs.target == 'distributed-linux'
    # Runner scale sets route by their single scale-set label; platform
    # requirements are enforced by the controller pool policy.
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.linux_pool || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed Linux placement
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$(hostname)" "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = Linux
          test -r /proc/self/cgroup
          cat /proc/self/cgroup

  distributed-windows:
    if: inputs.target == 'distributed-windows'
    # The isolated acceptance label is platform-neutral; the controller pool
    # policy selects Windows or Linux nodes for each qualification phase.
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.windows_pool || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed Windows placement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "runner=$env:RUNNER_NAME"
          "host=$env:COMPUTERNAME"
          "os=$env:RUNNER_OS"
          "arch=$env:RUNNER_ARCH"
          if ($env:RUNNER_OS -ne 'Windows') { throw 'expected Windows runner' }

  distributed-container:
    if: inputs.target == 'distributed-container'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.container_pool || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed container placement
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$(hostname)" "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = Linux
          test -r /.dockerenv
          test -r /proc/self/cgroup
          cat /proc/self/cgroup

  beam-runtime:
    if: inputs.target == 'beam-runtime'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.beam_pool || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      ERL_FLAGS: "+S 4:4 +SDcpu 2 +SDio 2"
    steps:
      - name: Check out acceptance contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: ci-runner-farm

      - name: Record image, libc, and initial cgroup evidence
        id: memory-baseline
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          ldd --version
          ci-runner-farm/scripts/distributed-beam-memory-check.sh snapshot "$RUNNER_TEMP/beam-memory-events"
          echo 'created=true' >>"$GITHUB_OUTPUT"

      - name: Check out Phoenix coverage canary
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: dinglebear-ai/phoenix
          path: phoenix

      - name: Record Phoenix coverage revision
        working-directory: phoenix
        shell: bash
        run: git rev-parse HEAD

      - name: Resolve pinned BEAM toolchain
        id: beam
        working-directory: phoenix
        shell: bash
        run: |
          set -euo pipefail
          erlang="$(sed -n 's/^erlang *= *"\(.*\)"/\1/p' .mise.toml)"
          elixir="$(sed -n 's/^elixir *= *"\(.*\)"/\1/p' .mise.toml)"
          test -n "$erlang" && test -n "$elixir"
          printf 'erlang=%s\nelixir=%s\n' "$erlang" "$elixir" >>"$GITHUB_OUTPUT"

      - name: Bind OTP artifact to the live image
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          case "${ID:-}:${VERSION_ID:-}" in
            ubuntu:20.04) image_os=ubuntu20 ;;
            ubuntu:22.04) image_os=ubuntu22 ;;
            ubuntu:24.04) image_os=ubuntu24 ;;
            ubuntu:26.04) image_os=ubuntu26 ;;
            *) echo "unsupported runner image ${ID:-unknown} ${VERSION_ID:-unknown}" >&2; exit 1 ;;
          esac
          printf 'ImageOS=%s\n' "$image_os" >>"$GITHUB_ENV"

      - name: Start pinned OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: ${{ steps.beam.outputs.erlang }}
          elixir-version: ${{ steps.beam.outputs.elixir }}

      - name: Prove OTP startup
        shell: bash
        run: erl -noshell -eval 'io:format("otp=~s~n", [erlang:system_info(otp_release)]), halt(0).'

      - name: Run Phoenix coverage canary
        working-directory: phoenix
        shell: bash
        run: |
          set -euo pipefail
          scripts/run-unprivileged.sh mix local.hex --force
          scripts/run-unprivileged.sh mix local.rebar --force
          scripts/run-unprivileged.sh mix deps.get
          scripts/run-unprivileged.sh mix test --cover

      - name: Require no cgroup OOM events
        if: ${{ always() && steps.memory-baseline.outputs.created == 'true' }}
        shell: bash
        run: ci-runner-farm/scripts/distributed-beam-memory-check.sh assert "$RUNNER_TEMP/beam-memory-events"

  cancellation:
    if: inputs.target == 'cancellation'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.cancellation_pool || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Hold placement for cancellation and reassignment proof
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s host=%s pid=%s\n' "$RUNNER_NAME" "$(hostname)" "$$"
          trap 'echo cancellation-signal-observed; exit 0' TERM INT
          for _ in $(seq 1 900); do sleep 1; done
