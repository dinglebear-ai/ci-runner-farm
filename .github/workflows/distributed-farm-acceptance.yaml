name: Distributed Farm Acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Acceptance surface to exercise
        required: true
        type: choice
        options:
          - production-ops
          - distributed-linux
          - distributed-container
          - distributed-windows
          - cancellation
      linux_pool:
        description: Linux scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-ops
        options:
          - ci-pool-ops
          - ci-pool-acceptance-linux
      windows_pool:
        description: Windows scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-windows
        options:
          - ci-pool-windows
          - ci-pool-acceptance-linux
          - ci-pool-acceptance-windows
      container_pool:
        description: Container scale-set routing label (use the isolated lane for fleet qualification)
        required: true
        type: choice
        default: ci-pool-residential-egress
        options:
          - ci-pool-residential-egress
          - ci-pool-acceptance-linux
      cancellation_pool:
        description: Scale-set routing label used for cancellation proof
        required: true
        type: choice
        default: ci-pool-ops
        options:
          - ci-pool-ops
          - ci-pool-acceptance-linux

permissions:
  contents: read

jobs:
  production-ops:
    if: inputs.target == 'production-ops'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && 'ci-pool-ops' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record production ops isolation and nested-cgroup evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nkernel=%s\n' "$RUNNER_NAME" "$(hostname)" "$(uname -srmo)"
          test -r /proc/self/cgroup
          cat /proc/self/cgroup
          test -r /sys/fs/cgroup/cgroup.controllers
          grep -Eq '(^| )cpu( |$)' /sys/fs/cgroup/cgroup.controllers
          grep -Eq '(^| )memory( |$)' /sys/fs/cgroup/cgroup.controllers
          docker info --format 'cgroup_driver={{.CgroupDriver}} cgroup_version={{.CgroupVersion}}'

  distributed-linux:
    if: inputs.target == 'distributed-linux'
    # Runner scale sets route by their single scale-set label; platform
    # requirements are enforced by the controller pool policy.
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.linux_pool || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed Linux placement
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$(hostname)" "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = Linux
          test -r /proc/self/cgroup
          cat /proc/self/cgroup

  distributed-windows:
    if: inputs.target == 'distributed-windows'
    # The isolated acceptance label is platform-neutral; the controller pool
    # policy selects Windows or Linux nodes for each qualification phase.
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.windows_pool || 'windows-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed Windows placement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "runner=$env:RUNNER_NAME"
          "host=$env:COMPUTERNAME"
          "os=$env:RUNNER_OS"
          "arch=$env:RUNNER_ARCH"
          if ($env:RUNNER_OS -ne 'Windows') { throw 'expected Windows runner' }

  distributed-container:
    if: inputs.target == 'distributed-container'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.container_pool || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record distributed container placement
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nhost=%s\nos=%s\narch=%s\n' "$RUNNER_NAME" "$(hostname)" "$RUNNER_OS" "$RUNNER_ARCH"
          test "$RUNNER_OS" = Linux
          test -r /.dockerenv
          test -r /proc/self/cgroup
          cat /proc/self/cgroup

  cancellation:
    if: inputs.target == 'cancellation'
    runs-on: ${{ github.repository_owner == 'dinglebear-ai' && inputs.cancellation_pool || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Hold placement for cancellation and reassignment proof
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s host=%s pid=%s\n' "$RUNNER_NAME" "$(hostname)" "$$"
          trap 'echo cancellation-signal-observed; exit 0' TERM INT
          for _ in $(seq 1 900); do sleep 1; done
