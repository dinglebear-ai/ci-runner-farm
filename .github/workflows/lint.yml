name: Lint

# Fast static gates for the Unraid plugin plus the platform-agnostic distributed
# controller/node core. The legacy gate covers shell, PHP, config parity, and the
# crf-scaleset Go suite. A separate hosted matrix proves the new Elixir/Rust core
# on ordinary Linux and Windows hosts without relying on Unraid.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Shell + PHP syntax and config parity
    # Trusted org runs use the isolated ops pool; public fork PRs stay GitHub-hosted.
    runs-on: ${{ (github.repository_owner == 'dinglebear-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'ci-pool-ops' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Go 1.25.3
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.3
          cache-dependency-path: tools/crf-scaleset/go.sum

      - name: Go unit tests (crf-scaleset)
        working-directory: tools/crf-scaleset
        run: go test ./...

      - name: Shell syntax (bash -n)
        run: |
          set -e
          # *.sh always; plus the extension-less shell scripts Unraid runs from nchan/
          # and event/ (lint the ones with a shell shebang, skip any non-shell helper).
          for f in $(git ls-files '*.sh'); do echo "bash -n $f"; bash -n "$f"; done
          for f in $(git ls-files 'src/usr/local/emhttp/plugins/*/nchan/*' 'src/usr/local/emhttp/plugins/*/event/*'); do
            case "$(head -1 "$f" 2>/dev/null)" in '#!'*sh*) echo "bash -n $f"; bash -n "$f" ;; esac
          done

      - name: PHP syntax (php -l)
        run: |
          set -e
          # *.php plus the .page files, which are PHP under a small "key=val ... ---" header
          # (php -l treats the header as literal text). RunnerFarmSettings.page holds the
          # $defaults array, so a syntax error there must not slip past this gate.
          for f in $(git ls-files '*.php' 'src/usr/local/emhttp/plugins/*/*.page'); do
            grep -q '<?php' "$f" || continue
            echo "php -l $f"
            php -l "$f"
          done

      - name: Behavioral regression suite
        run: |
          set -e
          for test in tests/*.sh; do
            case "$test" in
              tests/native-plugin-payload.sh|tests/portable-container-adapter.sh|tests/real-docker-container-adapter.sh|tests/final-release-gate.sh) continue ;;
            esac
            echo "bash $test"
            bash "$test"
          done

  distributed-core:
    name: Distributed core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Go 1.25.3 for bundle smoke
        if: runner.os == 'Linux'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.3
          cache-dependency-path: tools/crf-scaleset/go.sum

      - name: Set up Elixir 1.20.3 / OTP 29.0.5
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: 1.20.3
          otp-version: 29.0.5

      - name: Set up Rust 1.97.1
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install static Linux adapter target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust lint (Windows-supported packages)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --exclude crf-container-adapter --all-targets -- -D warnings

      - name: Rust tests
        if: runner.os == 'Linux'
        run: cargo test --workspace

      - name: Rust tests (Windows-supported packages)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude crf-container-adapter

      - name: Portable container adapter
        if: runner.os == 'Linux'
        run: bash tests/portable-container-adapter.sh

      - name: Real Docker container adapter acceptance
        if: runner.os == 'Linux'
        env:
          CRF_RUN_REAL_DOCKER_ACCEPTANCE: '1'
        run: bash tests/real-docker-container-adapter.sh

      - name: Set up QEMU for distributed runner image contracts
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx for distributed runner image contracts
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

      - name: Build distributed Linux runner image contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image="crf-distributed-runner:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          arm_image="${image}-arm64"
          trap 'docker image rm -f "$image" "$arm_image" >/dev/null 2>&1 || true' EXIT
          docker buildx build --pull=false --platform linux/amd64 --load \
            -f deployments/distributed/runner.Dockerfile \
            -t "$image" deployments/distributed
          docker run --rm --network none --read-only \
            --entrypoint /usr/local/bin/crf-runner-image-contract "$image" |
            jq -e '.compatible == true and (.capabilities | index("otp-28-compatible")) != null and (.capabilities | index("php-cli")) != null and (.runtimes.php | test("^[0-9]+\\.[0-9]+$"))'
          docker run --rm --network none --read-only --entrypoint php "$image" \
            -r 'exit(PHP_MAJOR_VERSION >= 8 ? 0 : 1);'
          test "$(docker run --rm --network none --entrypoint id "$image" -u)" = 0
          docker buildx build --pull=false --platform linux/arm64 --load \
            -f deployments/distributed/runner.Dockerfile \
            -t "$arm_image" deployments/distributed
          docker run --rm --platform linux/arm64 --network none --read-only \
            --entrypoint /usr/local/bin/crf-runner-image-contract "$arm_image" |
            jq -e '.compatible == true and .arch == "arm64" and (.capabilities | index("otp-28-compatible")) != null and (.capabilities | index("php-cli")) != null and (.runtimes.php | test("^[0-9]+\\.[0-9]+$"))'
          docker run --rm --platform linux/arm64 --network none --read-only --entrypoint php "$arm_image" \
            -r 'exit(PHP_MAJOR_VERSION >= 8 ? 0 : 1);'
          test "$(docker run --rm --platform linux/arm64 --network none --entrypoint id "$arm_image" -u)" = 0

      - name: Native plugin payload
        if: runner.os == 'Linux'
        run: bash tests/native-plugin-payload.sh

      - name: Final offline release gate
        if: runner.os == 'Linux'
        run: bash tests/final-release-gate.sh

      - name: Build distributed Windows node package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-distributed-windows-node.ps1

      - name: Windows Hyper-V container adapter contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/windows-container-adapter.ps1

      - name: Validate Windows package and service behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'CiRunnerFarmNode'
          $installRoot = Join-Path $env:RUNNER_TEMP 'crf-windows-install'
          $configRoot = Join-Path $env:ProgramData "CiRunnerFarm-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "CRF_CI_WINDOWS_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CRF_CI_WINDOWS_CONFIG_ROOT=$configRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          function Invoke-CheckedText([string] $Program, [string[]] $Arguments) {
            $output = & $Program @Arguments 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "$Program $($Arguments -join ' ') failed ($LASTEXITCODE): $output" }
            return $output
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\packaging\distributed\windows\Install-CrfNodeService.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          $archive = Get-ChildItem build/distributed/ci-runner-farm-node-*-windows-x86_64.zip
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows node archive' }
          $expanded = Join-Path $env:RUNNER_TEMP 'crf-windows-archive'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $names = Get-ChildItem -LiteralPath $expanded -Recurse -File | ForEach-Object Name
          foreach ($required in @('crf-node.exe', 'crf-container-adapter.cmd', 'WindowsContainerAdapter.ps1', 'WindowsRunnerEntrypoint.ps1', 'WindowsRunner.Dockerfile', 'Prepare-WindowsRunnerContext.ps1', 'Install-CrfNodeService.ps1', 'node-env.example', 'runner-manifest.example.json')) {
            if ($required -notin $names) { throw "Archive is missing $required" }
          }
          $binary = (Get-ChildItem -LiteralPath $expanded -Recurse -Filter crf-node.exe -File).FullName
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $expectedVersion = ($metadata.packages | Where-Object name -eq 'crf-node').version
          $actualVersion = Invoke-CheckedText $binary @('--version')
          if ($actualVersion.Trim() -ne "crf-node $expectedVersion") { throw "Unexpected binary version: $actualVersion" }

          $example = Get-Content packaging/distributed/windows/node-env.example -Raw
          $unknown = Join-Path $env:RUNNER_TEMP 'node-unknown.env'
          Set-Content -LiteralPath $unknown -Value ($example + "`nCRF_CONTROLLER_ADRESS=typo")
          try {
            & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $unknown -InstallRoot $installRoot -ConfigRoot $configRoot
            throw 'Installer accepted an unknown CRF key'
          } catch {
            if ($_.Exception.Message -eq 'Installer accepted an unknown CRF key') { throw }
          }
          $duplicate = Join-Path $env:RUNNER_TEMP 'node-duplicate.env'
          Set-Content -LiteralPath $duplicate -Value ($example + "`nCRF_NODE_ID=duplicate")
          try {
            & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $duplicate -InstallRoot $installRoot -ConfigRoot $configRoot
            throw 'Installer accepted a duplicate CRF key'
          } catch {
            if ($_.Exception.Message -eq 'Installer accepted a duplicate CRF key') { throw }
          }
          foreach ($missingPairKey in @('CRF_NODE_STATUS_PATH', 'CRF_NODE_LAUNCH_TOKEN')) {
            $oneSided = Join-Path $env:RUNNER_TEMP "node-one-sided-$missingPairKey.env"
            $oneSidedContent = ($example -split "`r?`n" | Where-Object { $_ -notmatch "^$missingPairKey=" }) -join "`n"
            Set-Content -LiteralPath $oneSided -Value $oneSidedContent
            try {
              & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $oneSided -InstallRoot $installRoot -ConfigRoot $configRoot
              throw "Installer accepted one-sided node status configuration without $missingPairKey"
            } catch {
              if ($_.Exception.Message -like 'Installer accepted one-sided*') { throw }
              if ($_.Exception.Message -notmatch 'must be configured together') { throw }
            }
          }

          foreach ($invalidToken in @('too-short', ('a' * 42), ('a' * 44), ('a' * 42 + '!'))) {
            $invalidLaunch = Join-Path $env:RUNNER_TEMP "node-invalid-launch-$($invalidToken.Length).env"
            $invalidContent = $example.Replace('REPLACE_ME_WITH_43_URLSAFE_CHARACTERS_12345', $invalidToken)
            Set-Content -LiteralPath $invalidLaunch -Value $invalidContent
            try {
              & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $invalidLaunch -InstallRoot $installRoot -ConfigRoot $configRoot
              throw 'Installer accepted an invalid node launch token'
            } catch {
              if ($_.Exception.Message -eq 'Installer accepted an invalid node launch token') { throw }
              if ($_.Exception.Message -notmatch '43-character base64url token') { throw }
            }
          }

          $environmentFile = Join-Path $env:RUNNER_TEMP 'node-valid.env'
          $configured = $example.Replace('C:\ProgramData\CiRunnerFarm', $configRoot).Replace('REPLACE_ME_WITH_43_URLSAFE_CHARACTERS_12345', ('v' * 43))
          Set-Content -LiteralPath $environmentFile -Value $configured
          & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $environmentFile -InstallRoot $installRoot -ConfigRoot $configRoot

          $qc = Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qc', $serviceName)
          if ($qc -notmatch 'START_TYPE\s+: 3\s+DEMAND_START') { throw "Service is not Manual: $qc" }
          if ($qc -notmatch 'SERVICE_START_NAME\s+: LocalSystem') { throw "Service identity is not LocalSystem: $qc" }
          if ((Get-Service -Name $serviceName).Status -ne 'Stopped') { throw 'Installer unexpectedly started the service' }
          $failure = Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qfailure', $serviceName)
          if ($failure -notmatch 'RESTART -- Delay = 5000 milliseconds' -or $failure -notmatch 'RESTART -- Delay = 60000 milliseconds') {
            throw "Service failure policy is incomplete: $failure"
          }
          $registryEnvironment = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" -Name Environment).Environment
          if (-not ($registryEnvironment -contains "CRF_SERVICE_ERROR_LOG=$configRoot\logs\service-errors.log")) { throw 'Registry environment is missing the error log contract' }

          $acl = Get-Acl -LiteralPath $configRoot
          if (-not $acl.AreAccessRulesProtected) { throw 'Configuration ACL still inherits permissions' }
          $allowed = @('NT AUTHORITY\SYSTEM', 'BUILTIN\Administrators')
          $unexpected = $acl.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.IdentityReference.Value -notin $allowed }
          if ($unexpected) { throw "Configuration ACL grants unexpected identities: $($unexpected.IdentityReference.Value -join ', ')" }
          foreach ($identity in $allowed) {
            if (-not ($acl.Access.IdentityReference.Value -contains $identity)) { throw "Configuration ACL is missing $identity" }
          }

          # Start only the disposable CI service. Its deliberately unprovisioned TLS paths must
          # stop it with a concrete, bounded error category in the protected service log.
          Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('start', $serviceName) | Out-Null
          $errorLog = Join-Path $configRoot 'logs\service-errors.log'
          for ($attempt = 0; $attempt -lt 50 -and -not (Test-Path -LiteralPath $errorLog); $attempt++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path -LiteralPath $errorLog)) { throw 'Service failure did not create its observable error log' }
          $errorText = Get-Content -LiteralPath $errorLog -Raw
          if ($errorText -notmatch '^crf-node daemon failure: [A-Za-z]+') { throw "Service error was not a concrete bounded category: $errorText" }
          if ((Get-Item -LiteralPath $errorLog).Length -gt 65536) { throw 'Service error log exceeded its bound' }
          for ($attempt = 0; $attempt -lt 50 -and (Get-Service -Name $serviceName).Status -ne 'Stopped'; $attempt++) { Start-Sleep -Milliseconds 200 }
          if ((Get-Service -Name $serviceName).Status -ne 'Stopped') { throw 'Disposable service did not stop after its expected configuration failure' }

          # Make every upgrade target observably different, then inject a failure after each
          # mutation boundary and require a byte/config/ACL/registry-exact rollback.
          $installedBinary = Join-Path $installRoot 'crf-node.exe'
          $installedEnvironment = Join-Path $configRoot 'node.env'
          $installedAdapterLauncher = Join-Path $installRoot 'crf-container-adapter.cmd'
          $installedAdapterScript = Join-Path $installRoot 'WindowsContainerAdapter.ps1'
          Set-Content -LiteralPath $installedBinary -Value 'pre-upgrade-binary'
          Add-Content -LiteralPath $installedEnvironment -Value '# pre-upgrade-environment'
          Set-Content -LiteralPath $installedAdapterLauncher -Value 'pre-upgrade-launcher'
          Set-Content -LiteralPath $installedAdapterScript -Value 'pre-upgrade-adapter'
          Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('config', $serviceName, 'binPath=', 'C:\Windows\System32\cmd.exe /c exit 0', 'start=', 'disabled', 'obj=', 'LocalSystem') | Out-Null
          Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('description', $serviceName, 'Pre-upgrade rollback sentinel') | Out-Null
          Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('failure', $serviceName, 'reset=', '123', 'actions=', 'restart/3210') | Out-Null
          Invoke-CheckedText "$env:SystemRoot\System32\icacls.exe" @($configRoot, '/grant', 'Users:(OI)(CI)R') | Out-Null

          function Get-RollbackFingerprint {
            $serviceKey = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
            $registry = Get-ItemProperty -LiteralPath $serviceKey
            $failureBytes = if ($registry.PSObject.Properties.Name -contains 'FailureActions') { [Convert]::ToBase64String([byte[]] $registry.FailureActions) } else { '<absent>' }
            @(
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedBinary).Hash,
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedEnvironment).Hash,
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedAdapterLauncher).Hash,
              (Get-FileHash -Algorithm SHA256 -LiteralPath $installedAdapterScript).Hash,
              (Get-Acl -LiteralPath $configRoot).Sddl,
              (Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qc', $serviceName)),
              (Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qdescription', $serviceName)),
              (Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qfailure', $serviceName)),
              (($registry.Environment | Sort-Object) -join "`n"),
              $failureBytes
            ) -join "`n---`n"
          }

          $preUpgrade = Get-RollbackFingerprint
          foreach ($boundary in @('acl', 'files', 'service-config', 'failure-policy', 'registry-environment')) {
            $env:CRF_INSTALLER_TEST_FAILURE = $boundary
            try {
              & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $environmentFile -InstallRoot $installRoot -ConfigRoot $configRoot
              throw "Upgrade unexpectedly succeeded at injected boundary $boundary"
            } catch {
              if ($_.Exception.Message -eq "Upgrade unexpectedly succeeded at injected boundary $boundary") { throw }
              if ($_.Exception.Message -notmatch "Injected installer failure after $boundary") { throw }
            } finally {
              Remove-Item Env:CRF_INSTALLER_TEST_FAILURE -ErrorAction SilentlyContinue
            }
            $postFailure = Get-RollbackFingerprint
            if ($postFailure -cne $preUpgrade) { throw "Upgrade rollback changed state after injected $boundary failure" }
          }

          # A successful reinstall must replace the restored sentinel state with the safe contract.
          & packaging/distributed/windows/Install-CrfNodeService.ps1 -NodeBinary $binary -EnvironmentFile $environmentFile -InstallRoot $installRoot -ConfigRoot $configRoot
          $reinstalledQc = Invoke-CheckedText "$env:SystemRoot\System32\sc.exe" @('qc', $serviceName)
          if ($reinstalledQc -notmatch 'START_TYPE\s+: 3\s+DEMAND_START' -or $reinstalledQc -notmatch 'SERVICE_START_NAME\s+: LocalSystem') {
            throw "Reinstall did not restore the safe service contract: $reinstalledQc"
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installedBinary).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash) {
            throw 'Reinstall did not replace the node binary'
          }

      - name: Upload distributed Windows node package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-runner-farm-node-windows-x86_64
          path: build/distributed/ci-runner-farm-node-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable Windows service
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $serviceName = 'CiRunnerFarmNode'
          $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($null -ne $existing) {
            & "$env:SystemRoot\System32\sc.exe" delete $serviceName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete $serviceName ($LASTEXITCODE)" }
            for ($attempt = 0; $attempt -lt 30 -and $null -ne (Get-Service -Name $serviceName -ErrorAction SilentlyContinue); $attempt++) {
              Start-Sleep -Milliseconds 200
            }
            if ($null -ne (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) { throw "$serviceName was not deleted" }
          }
          foreach ($path in @($env:CRF_CI_WINDOWS_INSTALL_ROOT, $env:CRF_CI_WINDOWS_CONFIG_ROOT)) {
            if ($path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Build Rust scheduler bridge
        run: cargo build -p crf-scheduler

      - name: Expose scheduler binary to controller tests
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          printf 'CRF_SCHEDULER_BIN=%s/target/debug/crf-scheduler%s\n' "$GITHUB_WORKSPACE" "$suffix" >> "$GITHUB_ENV"

      - name: Elixir formatting
        working-directory: controller
        run: mix format --check-formatted

      - name: Elixir compile warnings
        working-directory: controller
        run: mix compile --warnings-as-errors

      - name: Elixir tests
        working-directory: controller
        run: mix test

      - name: Build distributed Linux service bundle
        if: runner.os == 'Linux'
        run: scripts/build-distributed-bundle.sh

      - name: Verify distributed Linux service bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="$(find build/distributed -maxdepth 1 -type f -name 'ci-runner-farm-distributed-*.tar.gz' -print -quit)"
          test -n "$bundle"
          scripts/verify-distributed-bundle.sh "$bundle"
