name: Lint

# Fast static gates for the Unraid plugin plus the platform-agnostic distributed
# controller/node core. The legacy gate covers shell, PHP, config parity, and the
# crf-scaleset Go suite. A separate hosted matrix proves the new Elixir/Rust core
# on ordinary Linux and Windows hosts without relying on Unraid.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Shell + PHP syntax and config parity
    # Trusted org runs use the isolated ops pool; public fork PRs stay GitHub-hosted.
    runs-on: ${{ (github.repository_owner == 'dinglebear-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","ci-pool-ops"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Go 1.25.3
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.3
          cache-dependency-path: tools/crf-scaleset/go.sum

      - name: Go unit tests (crf-scaleset)
        working-directory: tools/crf-scaleset
        run: go test ./...

      - name: Shell syntax (bash -n)
        run: |
          set -e
          # *.sh always; plus the extension-less shell scripts Unraid runs from nchan/
          # and event/ (lint the ones with a shell shebang, skip any non-shell helper).
          for f in $(git ls-files '*.sh'); do echo "bash -n $f"; bash -n "$f"; done
          for f in $(git ls-files 'src/usr/local/emhttp/plugins/*/nchan/*' 'src/usr/local/emhttp/plugins/*/event/*'); do
            case "$(head -1 "$f" 2>/dev/null)" in '#!'*sh*) echo "bash -n $f"; bash -n "$f" ;; esac
          done

      - name: PHP syntax (php -l)
        run: |
          set -e
          # *.php plus the .page files, which are PHP under a small "key=val ... ---" header
          # (php -l treats the header as literal text). RunnerFarmSettings.page holds the
          # $defaults array, so a syntax error there must not slip past this gate.
          for f in $(git ls-files '*.php' 'src/usr/local/emhttp/plugins/*/*.page'); do
            grep -q '<?php' "$f" || continue
            echo "php -l $f"
            php -l "$f"
          done

      - name: Behavioral regression suite
        run: |
          set -e
          for test in tests/*.sh; do
            echo "bash $test"
            bash "$test"
          done

  distributed-core:
    name: Distributed core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Elixir 1.20.3 / OTP 29.0.5
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: 1.20.3
          otp-version: 29.0.5

      - name: Set up Rust 1.97.1
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build Rust scheduler bridge
        run: cargo build -p crf-scheduler

      - name: Expose scheduler binary to controller tests
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          printf 'CRF_SCHEDULER_BIN=%s/target/debug/crf-scheduler%s\n' "$GITHUB_WORKSPACE" "$suffix" >> "$GITHUB_ENV"

      - name: Elixir formatting
        working-directory: controller
        run: mix format --check-formatted

      - name: Elixir compile warnings
        working-directory: controller
        run: mix compile --warnings-as-errors

      - name: Elixir tests
        working-directory: controller
        run: mix test
