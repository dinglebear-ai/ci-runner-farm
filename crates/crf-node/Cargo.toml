[package]
name = "crf-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crf-protocol = { path = "../crf-protocol" }
serde.workspace = true
serde_json = "1.0"
sha2 = "0.10"
rustls = { version = "0.23.35", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.2.0"
sysinfo = "0.39.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
ureq = "3.4.0"
tar = "0.4.46"
flate2 = "1.1.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
windows-service = "0.8.1"
